<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Mindful Tattva — A Psychology Club</title>
<meta name="description" content="Mindful Tattva is a psychology club: a room for conversations, a reading room, a wall of faces and a film.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/experience.css">
</head>
<body data-scene="intro">

  <canvas id="mt-canvas"></canvas>

  <!-- the room's air -->
  <div id="mt-vignette" aria-hidden="true"></div>

  <!-- ── the loader: one number, nothing else ───────────────────────── -->
  <div id="mt-loader" aria-live="polite">
    <div id="mt-loader-num">0</div>
    <div id="mt-loader-tag">Mindful Tattva</div>
  </div>

  <div id="mt-fade" aria-hidden="true"></div>

  <!-- ── the frame ──────────────────────────────────────────────────── -->
  <header id="mt-header">
    <a id="mt-mark" href="/" aria-label="Mindful Tattva — home">Mindful Tattva</a>
    <div id="mt-header-rule" aria-hidden="true"></div>
  </header>

  <div id="mt-sound" role="group" aria-label="Sound">
    <button type="button" id="mt-sound-toggle" aria-pressed="false">Sound</button>
    <span id="mt-sound-state">Off</span>
  </div>

  <main id="mt-stage" aria-live="polite">
    <p id="mt-kicker"></p>
    <h1 id="mt-title"></h1>
    <button type="button" id="mt-cta">Explore</button>
  </main>

  <!-- ── the segmented progress, centred at the bottom ──────────────── -->
  <footer id="mt-footer">
    <nav id="mt-dots" aria-label="Chapters"></nav>
    <p id="mt-count"><span id="mt-count-now">01</span><i>/</i><span>08</span></p>
  </footer>

  <!-- ── the sideways hint ──────────────────────────────────────────── -->
  <div id="mt-swipe" aria-hidden="true">
    <span class="mt-chev"></span>
    <em>Swipe</em>
    <span class="mt-chev"></span>
  </div>

  <section id="mt-fallback">
    <h1>Mindful Tattva</h1>
    <p>This walkthrough needs WebGL, which this browser has turned off or does not offer.
       The club itself is still here.</p>
    <a href="/">Go to the club</a>
  </section>

  <noscript><p id="mt-noscript">Mindful Tattva needs JavaScript enabled.</p></noscript>

  <script type="module" src="/assets/room.js"></script>
</body>
</html>
