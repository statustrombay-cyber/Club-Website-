<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0806">
<title>Mindful Tattva — A Psychology Club</title>
<meta name="description" content="Mindful Tattva is a psychology club: a room for conversations, a reading room, a wall of faces and a film.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/experience.css">
</head>
<body data-scene="intro">

  <canvas id="mt-canvas"></canvas>

  <!-- the room's air: vignette plus the chapter's own light -->
  <div id="mt-vignette" aria-hidden="true"></div>
  <div id="mt-air" aria-hidden="true"></div>

  <!-- ── the loader: one number, nothing else ───────────────────────── -->
  <div id="mt-loader" aria-live="polite">
    <div id="mt-loader-num">0</div>
  </div>

  <div id="mt-fade" aria-hidden="true"></div>

  <!-- ── SOUND, top left ────────────────────────────────────────────── -->
  <div id="mt-sound" role="group" aria-label="Sound">
    <button type="button" id="mt-sound-toggle" aria-pressed="false">
      <svg viewBox="0 0 18 14" aria-hidden="true" class="mt-spk">
        <path d="M1 5.2h3.1L8.4 1.6v10.8L4.1 8.8H1z" fill="currentColor"/>
        <path class="mt-wave" d="M11 4.1a4 4 0 0 1 0 5.8M13.4 1.9a7.2 7.2 0 0 1 0 10.2"
              fill="none" stroke="currentColor" stroke-width="1"/>
      </svg>
      <span>Sound</span>
    </button>
  </div>

  <!-- ── the wordmark, top centre ───────────────────────────────────── -->
  <a id="mt-mark" href="/" aria-label="Mindful Tattva — home">Mindful Tattva</a>

  <!-- ── the chapter card ───────────────────────────────────────────── -->
  <main id="mt-stage" aria-live="polite">
    <h1 id="mt-title"></h1>
    <button type="button" id="mt-cta">Explore</button>
  </main>

  <!-- ── the circle that invites the next chapter ───────────────────── -->
  <button type="button" id="mt-next" aria-label="Next chapter">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15M5.5 12.5 12 19l6.5-6.5"
      fill="none" stroke="currentColor" stroke-width="1"/></svg>
  </button>

  <!-- ── chapters, and how far through we are ───────────────────────── -->
  <footer id="mt-footer">
    <nav id="mt-dots" aria-label="Chapters"></nav>
    <div id="mt-progress" aria-hidden="true"><i></i></div>
  </footer>

  <section id="mt-fallback">
    <h1>Mindful Tattva</h1>
    <p>This walkthrough needs WebGL, which this browser has turned off or does not offer.
       The club itself is still here.</p>
    <a href="/">Go to the club</a>
  </section>

  <noscript><p id="mt-noscript">Mindful Tattva needs JavaScript enabled.</p></noscript>

  <script type="module" src="/assets/room.js"></script>
</body>
</html>
